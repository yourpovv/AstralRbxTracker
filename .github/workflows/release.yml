name: Build Release Binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build executables
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/AstralRbxTracker.exe ./cmd/AstralRbxTracker
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/AstralRbxTracker-linux ./cmd/AstralRbxTracker
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/AstralRbxTracker-macos ./cmd/AstralRbxTracker

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/* --title ${{ github.ref_name }} --generate-notes
